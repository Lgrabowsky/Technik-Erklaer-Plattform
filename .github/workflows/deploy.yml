# Baut bei jedem Push auf "main" ein Docker-Image, legt es in der GitHub Container Registry ab
# und startet es auf dem Hetzner-Server neu. Kann auch per Hand unter "Actions" gestartet werden.
#
# Nötige Repository-Secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST     IP-Adresse oder Name des Servers
#   DEPLOY_USER     Benutzer auf dem Server (z. B. deploy)
#   DEPLOY_SSH_KEY  privater SSH-Schlüssel nur für dieses Deployment
#   DEPLOY_PORT     SSH-Port (optional, Standard 22)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/lgrabowsky/technik-erklaer-plattform

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Server-Dateien kopieren (ohne .env)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "deploy/compose.yaml,deploy/Caddyfile,deploy/backup.sh,deploy/restore.sh"
          target: /opt/technik-plattform
          strip_components: 1

      - name: Neue Version starten
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_USER,GHCR_TOKEN,APP_IMAGE
          script_stop: true
          script: |
            cd /opt/technik-plattform
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export APP_IMAGE
            docker compose pull app
            # Datenbank-Migrationen, sobald es sie gibt (Befehl hängt vom gewählten ORM ab):
            # docker compose run --rm app node migrate.js
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            # Kurz prüfen, ob die Seite antwortet
            sleep 5
            docker compose exec -T app wget -q -O /dev/null http://127.0.0.1:3000/ && echo "Seite antwortet."
